#config_version=6

coils:
  # l_start_button instead of c_start_button and l_coin_lamps instead of
  # c_coin_lamps because this is a 12v driver for a normal incandescent or 12v
  # LED bayonett lamp and not an RGB LED.  Old school!
  l_coin_lamps:
    number: cabinet-1
    allow_enable: true
    default_pulse_ms: 0
  l_start_button:
    number: cabinet-3
    allow_enable: true
    default_pulse_ms: 0

  # Regular 48V coil drivers
  c_left_flipper:
    number: playfield1-1
    default_pulse_ms: 9
  c_left_flipper_hold:
    number: playfield1-2
    allow_enable: true
  c_right_flipper:
    number: playfield2-2
    default_pulse_ms: 9
  c_right_flipper_hold:
    number: playfield2-3
    allow_enable: true
  c_shield_kicker:
    number: playfield1-0
    default_pulse_ms: 10
  c_left_slingshot:
    number: playfield1-3
    default_pulse_ms: 9
  c_right_slingshot:
    number: playfield2-4
    default_pulse_ms: 9
  # First tuning pass: 11ms pulse; FAST autofire derives 22ms recycle (2x).
  c_pop_bumper_1:
    number: playfield1-6
    default_pulse_ms: 11
  c_pop_bumper_2:
    number: playfield1-5
    default_pulse_ms: 11
  c_pop_bumper_3:
    number: playfield1-7
    default_pulse_ms: 11
  c_pop_bumper_4:
    number: playfield2-7
    default_pulse_ms: 11
  c_drain_eject:
    number: playfield2-0
    default_pulse_ms: 6
  c_trough_eject:
    number: playfield2-1
    default_pulse_ms: 6
  # LEFT physical lock
  c_lock_1_eject:
    number: playfield1-4
    default_pulse_ms: 10
  # RIGHT physical lock
  c_lock_2_eject:
    number: playfield2-5
    default_pulse_ms: 10
  # TOP physical lock
  c_lock_3_eject:
    number: playfield2-6
    default_pulse_ms: 10

flippers:
  flipper_left:
    main_coil: c_left_flipper
    hold_coil: c_left_flipper_hold
    activation_switch: s_flipper_left
    eos_switch: s_flipper_left_eos
  flipper_right:
    main_coil: c_right_flipper
    hold_coil: c_right_flipper_hold
    activation_switch: s_flipper_right
    eos_switch: s_flipper_right_eos

autofire_coils:
  pop_bumper_1:
    coil: c_pop_bumper_1
    switch: s_pop_bumper_1
    ball_search_order: 0
  pop_bumper_2:
    coil: c_pop_bumper_2
    switch: s_pop_bumper_2
    ball_search_order: 0
  pop_bumper_3:
    coil: c_pop_bumper_3
    switch: s_pop_bumper_3
    ball_search_order: 0
  pop_bumper_4:
    coil: c_pop_bumper_4
    switch: s_pop_bumper_4
    ball_search_order: 0
  left_slingshot:
    coil: c_left_slingshot
    switch: s_left_slingshot
    ball_search_order: 0
  right_slingshot:
    coil: c_right_slingshot
    switch: s_right_slingshot
    ball_search_order: 0
  shield_kicker:
    coil: c_shield_kicker
    switch: s_left_out_lane
    ball_search_order: 0
    enable_events: mode_shield_started
    disable_events: mode_shield_stopped, ball_ended, game_ended

# Power-on cabinet lamps: enable once after FAST startup, independent of modes.
# FAST's normal shutdown expires the driver watchdog; no off show is needed.
coil_player:
  init_phase_4:
    l_coin_lamps: enable
