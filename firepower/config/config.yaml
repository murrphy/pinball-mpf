#config_version=6

config:
- hardware.yaml
- colors.yaml
- displays.yaml
- devices.yaml
- switches.yaml
- credits.yaml
- coils.yaml
- lights.yaml
- sounds.yaml
- infolights.yaml
- modes.yaml
- logging.yaml

mpf:
  report_crashes: never

machine:    
  balls_installed: 3
  min_balls: 3

playfields:
  playfield:
    default_source_device: bd_plunger_lane
    enable_ball_search: true
    tags: default

game:
  balls_per_game: 5
  max_players: 4

player_vars:
  firepower_bonus_level:
    initial_value: 1
    value_type: int
  bonus_value:
    initial_value: 0
    value_type: int
  bonus_multiplier:
    initial_value: 1
    value_type: int
  bonus_collect_base_value:
    initial_value: 0
    value_type: int
  bonus_collect_pass:
    initial_value: 1
    value_type: int
  bonus_collect_running:
    initial_value: 0
    value_type: int