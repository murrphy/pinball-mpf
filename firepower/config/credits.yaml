#config_version=6

credits:
  max_credits: 12
  free_play: false
  # No physical service-credit switch is defined. Do not substitute paid coins.
  service_credits_switch: []
  events:
    - event: firepower_match_credit
      credits: 1
      type: match
    - event: firepower_high_score_credit
      credits: 1
      type: high_score_to_date
  switches:
    - switch: s_coin_left
      type: money
      value: .25
    - switch: s_coin_right
      type: money
      value: .25
  pricing_tiers:
    - price: .50
      credits: 1
    - price: 1
      credits: 3
