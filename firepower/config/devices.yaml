#config_version=6

ball_devices:
  bd_drain:
    ball_switches: s_drain
    eject_coil: c_drain_eject
    eject_targets: bd_trough
    tags: drain
    # One-ball drain: reject brief bounce without a half-second settling wait.
    entrance_count_delay: 50ms
    exit_count_delay: 50ms
    ball_search_order: 0
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3
    eject_coil: c_trough_eject
    eject_targets: bd_plunger_lane
    tags: home, trough
    eject_timeouts: 3s
    ball_search_order: 0
  bd_plunger_lane:
    # Normal MPF routing requests a trough ball and preserves balls_in_play.
    eject_events: serve_firepower_lock_replacement
    ball_switches: s_plunger
    mechanical_eject: true
    ball_search_order: 0
  # LEFT physical lock
  bd_lock1:
    ball_switches: s_lock_1
    eject_coil: c_lock_1_eject
    eject_timeouts: 750ms
    entrance_count_delay: 500ms
    ball_search_order: 1
  # RIGHT physical lock
  bd_lock2:
    ball_switches: s_lock_2
    eject_coil: c_lock_2_eject
    eject_timeouts: 750ms
    entrance_count_delay: 500ms
    ball_search_order: 2
  # TOP physical lock
  bd_lock3:
    ball_switches: s_lock_3
    eject_coil: c_lock_3_eject
    eject_timeouts: 750ms
    entrance_count_delay: 500ms
    ball_search_order: 3