#config_version=6

hardware:
  platform: fast
  driverboards: fast
  coils: fast
  segment_displays: fast
  hardware_sound_system: fast

fast:
  net:
    debug: false
    port: /dev/ttyAMA3
    controller: neuron
    io_loop:
      cabinet:
        model: FP-I/O-0024
        order: 1
      playfield1:
        model: FP-I/O-1616
        order: 2
      playfield2:
        model: FP-I/O-3208
        order: 3

  exp_int:
    debug: false
    port: /dev/ttyAMA4
    boards:
      backbox:
        model: FP-EXP-2000
        led_ports:
        - port: 1
          count: 32
          type: ws2812
        - port: 2
          count: 0
        - port: 3
          count: 0
        - port: 4
          count: 0
        led_hz: 30

  exp:
    debug: false
    port: /dev/ttyAMA5
    boards:
      playfield:
        model: FP-EXP-0081
        led_ports:
          - port: 1
            count: 32
            type: ws2812
          - port: 2
            count: 32
            type: ws2812
          - port: 3
            count: 32
            type: ws2812
          - port: 4
            count: 32
            type: ws2812
          - port: 5
            count: 128
            type: sk6812
          - port: 6
            count: 0
          - port: 7
            count: 0
          - port: 8
            count: 0

  seg:
    port: /dev/ttyAMA2

  aud:
    port: /dev/ttyACM0
    main_amp_enabled: true
    sub_amp_enabled: true
    headphones_amp_enabled: true

    main_steps: 20
    sub_steps: 20
    headphones_steps: 20

    default_main_volume: 32
    default_sub_volume: 32
    default_headphones_volume: 12

    persist_volume_settings: true

    max_hw_volume_main: 63
    max_hw_volume_sub: 63
    max_hw_volume_headphones: 63

    main_levels_list: None
    sub_levels_list: None
    headphones_levels_list: None

    link_sub_to_main: true
    link_headphones_to_main: false

    headphones_level: headphones
    mute_speakers_with_headphones: false