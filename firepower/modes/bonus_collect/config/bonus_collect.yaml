#config_version=6
##! mode: bonus_collect

# Firepower-specific end-of-ball bonus collection.
#
# This mode is started by base.yaml via queue_relay_player on ball_ending.
# The queue is held until bonus_collect_done is posted, which prevents MPF
# from starting the next ball and resetting bonus_value before collection.
#
# Canonical player vars used by this mode:
#   bonus_value       0..39, current displayed end-of-ball bonus units
#   bonus_multiplier  1..5, advanced by completing F-I-R-E
#
# Countdown behavior:
#   - each tick scores 1000
#   - each tick decrements bonus_value by 1, causing bonus_ladder to update lamps
#   - when bonus_value reaches 0, restore the original value and run another pass
#   - stop after bonus_collect_pass == bonus_multiplier
#   - reset bonus_value and bonus_multiplier for the next ball

mode:
  code: bonus_collect.BonusCollect
  start_events: start_bonus_collect
  stop_events: bonus_collect_done
  priority: 250

mode_settings:
  # Wait after processing a countdown cycle; never catch up overdue ticks.
  step_interval: 130ms

event_player:
  # Initialize the pass counter and save the original bonus before the first tick.
  mode_bonus_collect_started{current_player.bonus_value > 0}:
    - bonus_collect_prepare

  # No bonus to collect, but still release the ball_ending queue.
  mode_bonus_collect_started{current_player.bonus_value <= 0}:
    - bonus_collect_done

  # One real scoring/countdown step.
  bonus_collect_countdown_tick{current_player.bonus_value > 0 and current_player.bonus_collect_pass <= current_player.bonus_multiplier}:
    - bonus_collect_score_step

  # Finished one pass, but more multiplier passes remain.
  bonus_collect_countdown_tick{current_player.bonus_value <= 0 and current_player.bonus_collect_pass < current_player.bonus_multiplier}:
    - bonus_collect_next_pass
    - bonus_collect_restore_base|10ms

  # Finished the final pass.
  bonus_collect_countdown_tick{current_player.bonus_value <= 0 and current_player.bonus_collect_pass >= current_player.bonus_multiplier}:
    - bonus_collect_done

  bonus_collect_done:
    - mode_bonus_collect_show_ended
    - clear_bonus_lamps

variable_player:
  bonus_collect_prepare:
    bonus_collect_base_value:
      int: current_player.bonus_value
      action: set
    bonus_collect_pass:
      int: 1
      action: set
    bonus_collect_running:
      int: 1
      action: set

  # MPF variable_player supports add/set. Negative add is accepted by config
  # validation and is used here instead of the invalid "subtract" action.
  bonus_collect_score_step:
    score: 1000
    bonus_value:
      int: -1
      action: add

  bonus_collect_next_pass:
    bonus_collect_pass:
      int: 1
      action: add

  bonus_collect_restore_base:
    bonus_value:
      int: current_player.bonus_collect_base_value
      action: set

  bonus_collect_done:
    bonus_value:
      int: 0
      action: set
    bonus_multiplier:
      int: 1
      action: set
    bonus_collect_base_value:
      int: 0
      action: set
    bonus_collect_pass:
      int: 1
      action: set
    bonus_collect_running:
      int: 0
      action: set

sound_player:
  bonus_collect_score_step: bump
