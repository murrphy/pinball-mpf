#config_version=6

mode:
  start_events: start_firepower_multiball
  stop_events: multiball_firepower_ended, game_ended
  priority: 500

multiballs:
  firepower:
    ball_count: 3
    ball_locks: bd_lock1, bd_lock2, bd_lock3
    start_events: mode_firepower_multiball_started
    replace_balls_in_play: true
    shoot_again: 0

show_player:
  multiball_firepower_started:
    firepower_multiball_release:
      action: play
      loops: 0
