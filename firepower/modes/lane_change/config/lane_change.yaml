#config_version=6

mode:
  start_events: start_mode_lane_change
  stop_events: stop_mode_lane_change
  priority: 200

shot_profiles:
  fire_lane_profile:
    states:
      - name: off
        show: off
      - name: on
        show: on

shots:
  top_lane_f:
    switch: s_lane_f
    profile: fire_lane_profile
    show_tokens:
      led: l_lane_f
  top_lane_i:
    switch: s_lane_i
    profile: fire_lane_profile
    show_tokens:
      led: l_lane_i
  top_lane_r:
    switch: s_lane_r
    profile: fire_lane_profile
    show_tokens:
      led: l_lane_r
  top_lane_e:
    switch: s_lane_e
    profile: fire_lane_profile
    show_tokens:
      led: l_lane_e

shot_groups:
  lane_change:
    shots: top_lane_f, top_lane_i, top_lane_r, top_lane_e
    reset_events:
      lane_change_on_complete: 1s
    rotate_right_events: s_flipper_right_active

counters:
  lane_change_mltp_complete_count:
    count_events: lane_change_on_complete
    events_when_hit: mltp_lanes_done
    starting_count: 0
    direction: up
    persist_state: false

event_player:
  # FIRE rollovers always score 1000, but only unlit rollovers advance end-of-ball bonus.
  lane_change_off_hit:
    - advance_end_of_ball_bonus

  # FIRE + POWER is the separate Firepower Bonus feature.
  mltp_lanes_done{current_player.power_lit==1}:
    - fire_power_lit

variable_player:
  collect_firepower_bonus_10000:
    fire_lit:
      int: 0
      action: set
  collect_firepower_bonus_30000:
    fire_lit:
      int: 0
      action: set
  collect_firepower_bonus_50000:
    fire_lit:
      int: 0
      action: set
  light_outlane_specials:
    fire_lit:
      int: 0
      action: set
  # Reset end-of-ball bonus multiplier at start of lane-change mode / fresh ball.
  mode_lane_change_started:
    bonus_multiplier:
      int: 1
      action: set
  # FIRE completions advance the one true end-of-ball bonus multiplier.
  mltp_lanes_done{count==1}:
    bonus_multiplier:
      int: 2
      action: set
    fire_lit:
      int: 1
      action: set
  mltp_lanes_done{count==2}:
    bonus_multiplier:
      int: 3
      action: set
    fire_lit:
      int: 1
      action: set
  mltp_lanes_done{count==3}:
    bonus_multiplier:
      int: 4
      action: set
    fire_lit:
      int: 1
      action: set
  mltp_lanes_done{count>=4}:
    bonus_multiplier:
      int: 5
      action: set
    fire_lit:
      int: 1
      action: set

light_player:
  # Multiplier lamps show current end-of-ball bonus multiplier.
  mode_lane_change_started:
    l_bonus_multiplier_2x: off
    l_bonus_multiplier_3x: off
    l_bonus_multiplier_4x: off
    l_bonus_multiplier_5x: off
  mltp_lanes_done{count==1}:
    l_bonus_multiplier_2x: on
    l_bonus_multiplier_3x: off
    l_bonus_multiplier_4x: off
    l_bonus_multiplier_5x: off
  mltp_lanes_done{count==2}:
    l_bonus_multiplier_2x: off
    l_bonus_multiplier_3x: on
    l_bonus_multiplier_4x: off
    l_bonus_multiplier_5x: off
  mltp_lanes_done{count==3}:
    l_bonus_multiplier_2x: off
    l_bonus_multiplier_3x: off
    l_bonus_multiplier_4x: on
    l_bonus_multiplier_5x: off
  mltp_lanes_done{count>=4}:
    l_bonus_multiplier_2x: off
    l_bonus_multiplier_3x: off
    l_bonus_multiplier_4x: off
    l_bonus_multiplier_5x: on
  player_fire_lit{value==1}:
    l_fire:
      color: on
      priority: 2000

  player_fire_lit{value==0}:
    l_fire:
      color: off
      priority: 2000

show_player:
  mltp_lanes_done:
    fire_lit:
      action: play
      key: fire_lit_indicator
      loops: -1
      priority: 1000
    fire_lanes_complete_chase:
      action: play
      loops: 5
      priority: 900
  collect_firepower_bonus_10000:
    fire_lit:
      action: stop
      key: fire_lit_indicator
  collect_firepower_bonus_30000:
    fire_lit:
      action: stop
      key: fire_lit_indicator
  collect_firepower_bonus_50000:
    fire_lit:
      action: stop
      key: fire_lit_indicator
  light_outlane_specials:
    fire_lit:
      action: stop
      key: fire_lit_indicator
  ball_started{current_player.fire_lit==1}:
    fire_lit:
      action: play
      key: fire_lit_indicator
      loops: -1
      priority: 1000