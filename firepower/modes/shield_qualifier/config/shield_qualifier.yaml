#config_version=6

mode:
  start_events: start_mode_shield_qualifier
  stop_events: stop_mode_shield_qualifier, game_ended
  priority: 200

shot_profiles:
  shield_qualifier_profile:
    advance_on_hit: true
    states:
      - name: off
        show: flash
        speed: 5
      - name: lit
        show: on

shots:
  arrow_target_1:
    switch: s_arrow_1
    profile: shield_qualifier_profile
    show_tokens:
      led: l_arrow_1

  arrow_target_2:
    switch: s_arrow_2
    profile: shield_qualifier_profile
    show_tokens:
      led: l_arrow_2

  arrow_target_3:
    switch: s_arrow_3
    profile: shield_qualifier_profile
    show_tokens:
      led: l_arrow_3    

  arrow_target_4:
    switch: s_arrow_4
    profile: shield_qualifier_profile
    show_tokens:
      led: l_arrow_4    

  arrow_target_5:
    switch: s_arrow_5
    profile: shield_qualifier_profile
    show_tokens:
      led: l_arrow_5    

  arrow_target_6:
    switch: s_arrow_6
    profile: shield_qualifier_profile
    show_tokens:
      led: l_arrow_6

shot_groups:
  left_shield_qualifier:
    shots: arrow_target_1, arrow_target_2, arrow_target_3
    restart_events: reset_arrow_targets, shield_lit_complete, ball_ended

  right_shield_qualifier:
    shots: arrow_target_4, arrow_target_5, arrow_target_6
    restart_events: reset_arrow_targets, shield_lit_complete, ball_ended

  fire_qualifier:
    shots: arrow_target_1, arrow_target_2, arrow_target_3, arrow_target_4, arrow_target_5, arrow_target_6
    restart_events: reset_arrow_targets, ball_ended

event_player:
  left_shield_qualifier_lit_complete{current_player.jet_bumpers_all==0}:
    - start_mode_shield
    - enable_jet_bumpers_pair_left

  left_shield_qualifier_lit_complete{current_player.jet_bumpers_all==1}:
    - start_mode_shield

  right_shield_qualifier_lit_complete{current_player.jet_bumpers_all==0}:
    - start_mode_shield
    - enable_jet_bumpers_pair_right

  right_shield_qualifier_lit_complete{current_player.jet_bumpers_all==1}:
    - start_mode_shield

  fire_qualifier_lit_complete:
    - enable_jet_bumpers_all
    - light_spinner
    - reset_arrow_targets